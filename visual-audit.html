<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALANLA // 62 Yerel Görsel Doğrulama Paneli (Local Assets v3)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #141210;
      color: #FDFBF7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 30px 20px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 30px;
      border-bottom: 2px solid #2B2520;
      padding-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #D13A22;
    }
    p.subtitle {
      color: #A89F91;
      font-size: 14px;
      margin-top: 4px;
    }
    .badge {
      background: #22C55E;
      color: #141210;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
    }
    h2 {
      max-width: 1400px;
      margin: 40px auto 20px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #FDFBF7;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 4px solid #D13A22;
      padding-left: 12px;
    }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1E1B18;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2B2520;
      transition: transform 0.15s, border-color 0.15s;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #22C55E;
    }
    .img-wrap {
      width: 100%;
      height: 140px;
      background: #2B2520;
      overflow: hidden;
      position: relative;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .sample-pill {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(10, 10, 14, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94A3B8;
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    .info {
      padding: 12px;
    }
    .name {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
      color: #FDFBF7;
    }
    .id {
      font-family: monospace;
      font-size: 11px;
      color: #A89F91;
      background: #141210;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .tag-local {
      display: inline-block;
      margin-left: 6px;
      background: rgba(34, 197, 94, 0.2);
      color: #22C55E;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>

      <p class="subtitle">Kullanıcının assets/food klasörüne yerleştirdiği 39 malzeme ve 23 tarif yerel olarak doğrulanıyor.</p>
    </div>
    <div class="badge">AŞAMA 3: %100 YEREL ASSETLER</div>
  </header>

    function renderGrid(containerId, items, isRecipe = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = items.map(item => `
        <div class="card">
          <div class="img-wrap">
            <img src="${item.path}" alt="${item.name}" loading="lazy" />
            ${isRecipe ? '<div class="sample-pill">Örnek sunum</div>' : ''}
          </div>
          <div class="info">
            <div class="name">${item.name} <span class="tag-local">YEREL</span></div>
            <div class="id">${item.id}</div>
          </div>
        </div>
      `).join('');
    }

    renderGrid('ingredients-grid', INGREDIENTS, false);
    renderGrid('recipes-grid', RECIPES, true);
  </script>
</body>
</html>
